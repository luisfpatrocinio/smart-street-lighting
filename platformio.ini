; PlatformIO Project Configuration File
; Smart Street Lighting System (ESP32 NodeMCU)
; Production-grade modular firmware for Smart City demonstration

[platformio]
default_envs = esp32dev
description = Autonomous Smart Street Lighting System with TCRT5000 IR Sensing and Smooth PWM Fading

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor configuration
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time
    default

; Compiler warning and language level flags
build_flags = 
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0

; Upload configuration
upload_speed = 921600
